name: documind
description: "DocuMind — a local-first AI document intelligence application that indexes user documents on-device, performs contextual retrieval, and generates source-grounded responses through configurable AI providers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management (per project convention)
  provider: ^6.1.2

  # Local database + full-text search
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

  # File import / storage
  file_picker: ^10.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4

  # Document parsing
  syncfusion_flutter_pdf: ^30.2.4
  archive: ^4.0.7
  html_unescape: ^2.0.0

  # AI providers (REST)
  http: ^1.4.0

  # Misc UI
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
